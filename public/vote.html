<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vote • CredVote</title>
  <link rel="stylesheet" href="/styles.css" />

  <!-- Mini App: call ready() ASAP -->
  <script type="module" src="/miniapp-init.js"></script>
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand"><a href="/" style="color:inherit;text-decoration:none;">CredVote</a></div>
      <div class="row" style="flex-wrap:wrap; justify-content:flex-end;">
        <span id="walletLabel" class="pill">Not connected</span>
        <button id="disconnectBtn" class="btn secondary" style="display:none;">Disconnect</button>
        <button id="connectBtn" class="btn secondary">Connect</button>
      </div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div style="min-width:0;">
          <div class="h1" id="pollTitle">Loading…</div>
          <div class="initRow muted" id="pollWho" style="margin-top:8px;"></div>
          <div class="muted" id="pollTime" style="margin-top:8px;"></div>
        </div>

        <div class="row" style="flex-wrap:wrap; justify-content:flex-end;">
          <span id="statusBadge" class="pill">—</span>
          <span id="minScoreBadge" class="pill">Min Ethos score: —</span>
          <a id="contractLink" class="pill" href="#" target="_blank" rel="noreferrer" style="display:none;">Contract</a>
        </div>
      </div>

      <div id="pollDetails" class="notice" style="margin-top:12px; display:none;"></div>

      <div class="sepLine"></div>

      <div class="row" style="align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div class="panel" style="flex: 1 1 420px;">
          <div class="panelTitle">Choose option</div>
          <div id="options" class="row" style="flex-direction:column; align-items:stretch; gap:10px;"></div>

          <div class="row" style="margin-top:12px; flex-wrap:wrap;">
            <span id="eligLine" class="muted">Eligibility: —</span>
            <span id="votedLine" class="muted">—</span>
          </div>

          <div id="status" class="notice" style="margin-top:12px;">Ready.</div>
        </div>

        <div class="panel" style="flex: 1 1 420px;">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <div class="panelTitle" style="margin:0;">Live results</div>
            <button id="refreshResultsBtn" class="btn secondary">Refresh</button>
          </div>
          <div id="resultsBox" style="margin-top:10px;"></div>
          <div class="muted2" style="margin-top:10px; font-size:12px;">
            Results are weighted by oracle-signed reputation weight.
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="built">
        Built on Ethos &amp; Base
        <div>
          Want to create your own poll? DM me on
          <a href="https://x.com/Makssay_eth" target="_blank" rel="noreferrer">X</a>.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="/config.js"></script>
  <script src="/ethosPollAbi.js"></script>
  <script src="/vote.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("connectBtn");
      if (btn && window.VOTE_UTILS?.connectWallet) btn.onclick = window.VOTE_UTILS.connectWallet;
    });
  </script>
</body>
</html>
